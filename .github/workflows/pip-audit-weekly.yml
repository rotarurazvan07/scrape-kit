name: pip-audit weekly

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pip-audit-weekly
  cancel-in-progress: false

jobs:
  audit-and-file:
    name: Audit dependencies and file CVE issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project, pip-audit, and patched setuptools
        run: |
          pip install -e .
          # The editable install runs under PEP 517 build isolation, so the declared
          # build-system floor is resolved in a throw-away environment that is later
          # discarded. pip-audit scans this ambient interpreter, so the backend must be
          # upgraded here as well or the audit keeps seeing the runner's bundled copy.
          pip install pip-audit==2.10.1 "setuptools>=84.1.0"

      - name: Run pip-audit
        run: pip-audit --format json --output pip-audit-report.json || true

      - name: File deduplicated security issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/pip_audit_issues.py pip-audit-report.json >> "$GITHUB_STEP_SUMMARY"
