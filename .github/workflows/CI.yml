name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sun 03:00 UTC — extended burn-in + audit freshness

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SRC_DIR: scrape_kit
  TEST_DIR: tests
  COVERAGE_FAIL_UNDER: "90" # raised 85->90 with TRC remediation (ACR-2/ACR-7); measured 95.81% pre-additions
  PYTHON_LINT: "3.12"
  PYTHON_AUDIT: "3.11" # floor: catches floor-only breakage
  PYTHON_BURNIN: "3.12"
  SCRAPLING_VERSION: "0.4.14" # keep in sync with pyproject.toml — gate summary prints both

permissions:
  contents: read

jobs:
  # ── 1. LINT (gate) ─────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_LINT }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        run: pip install ruff==0.14.8

      - name: ruff format — check
        id: ruff_format
        run: ruff format --line-length 127 --target-version py311 --check "$SRC_DIR" "$TEST_DIR" | tee ruff-format.txt

      - name: ruff lint — check
        id: ruff_lint
        run: >-
          ruff check --line-length 127 --select E,F,B,C,SIM,PERF --ignore UP
          --output-format=concise "$SRC_DIR" "$TEST_DIR" | tee ruff-lint.txt

      - name: actionlint — workflow syntax + expression checks
        id: actionlint
        run: |
          bash <(curl \
            "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash")
          ./actionlint -no-color | tee actionlint.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🧹 Lint (ruff + actionlint)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| ruff format | ${{ steps.ruff_format.outcome }} |"
            echo "| ruff lint | ${{ steps.ruff_lint.outcome }} |"
            echo "| actionlint | ${{ steps.actionlint.outcome }} |"
            echo ""
            for f in ruff-format ruff-lint actionlint; do
              if [ -s "$f.txt" ]; then
                echo "### $f — violations"
                echo ""
                echo '```'
                cat "$f.txt"
                echo '```'
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 2. TEST MATRIX (gate) ──────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "${{ matrix.python-version }}"
          scrapling-version: ${{ env.SCRAPLING_VERSION }}

      - name: Run tests with coverage
        id: tests
        run: |
          pytest --cov="$SRC_DIR" \
            --cov-report=term-missing \
            --cov-fail-under="$COVERAGE_FAIL_UNDER" \
            --timeout=60 -n auto "$TEST_DIR" 2>&1 | tee pytest-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🧪 Test (Python ${{ matrix.python-version }})"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            if [ -f pytest-output.txt ]; then
              counts=$(grep -E "[0-9]+ passed" pytest-output.txt | tail -1 | sed 's/=//g' | xargs || true)
              total_cov=$(grep -E "^TOTAL" pytest-output.txt | tail -1 || true)
              echo "| Tests | ${counts:-no summary line} |"
              echo "| Coverage (stmts · miss · %) | ${total_cov:-n/a} |"
            else
              echo "| Tests | no output captured |"
            fi
            echo "| Coverage floor | $COVERAGE_FAIL_UNDER% — ${{ steps.tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. BURN-IN (advisory) ──────────────────────────────────────────────
  burn-in:
    name: Burn-in (advisory flakiness loop)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ env.PYTHON_BURNIN }}
          scrapling-version: ${{ env.SCRAPLING_VERSION }}

      - name: Run suite repeatedly to surface flakiness
        id: burnin
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then RUNS=10; else RUNS=3; fi
          for i in $(seq 1 "$RUNS"); do
            echo "── Burn-in run $i/$RUNS ──"
            if ! pytest --timeout=60 -n auto -q "$TEST_DIR"; then
              echo "$i" > burn-in-failed-at.txt
              echo "Suite run $i/$RUNS failed — flakiness signal, open a P1 review item"
              exit 1
            fi
          done
          echo "Burn-in: all $RUNS runs green."

      - name: Summary
        if: always()
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then RUNS=10; else RUNS=3; fi
          {
            echo "## 🔁 Burn-in (advisory flakiness loop)"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Iterations | $RUNS |"
            echo "| Result | ${{ steps.burnin.outcome }} |"
            if [ -f burn-in-failed-at.txt ]; then
              echo "| Failed at run | $(cat burn-in-failed-at.txt)/$RUNS |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 4. AUDIT (advisory) ────────────────────────────────────────────────
  audit:
    name: "Audit (advisory: security · complexity · types · docs)"
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mypy_errors: ${{ steps.mypy.outputs.mypy_errors }}
      bandit_issues: ${{ steps.bandit.outputs.bandit_issues }}
      semgrep_findings: ${{ steps.semgrep.outputs.semgrep_findings }}
      pip_audit_vulns: ${{ steps.pip_audit.outputs.pip_audit_vulns }}
      radon_complexity: ${{ steps.radon.outputs.radon_complexity }}
      vulture_dead: ${{ steps.vulture.outputs.vulture_dead }}
      interrogate_pct: ${{ steps.interrogate.outputs.interrogate_pct }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ env.PYTHON_AUDIT }}
          install-tools: >-
            bandit==1.9.2 pip-audit==2.9.0 radon==6.0.1 vulture==2.14
            mypy==1.18.2 interrogate==1.7.0 semgrep==1.144.0
          scrapling-version: ${{ env.SCRAPLING_VERSION }}

      - name: semgrep — pattern-based security & bug detection
        id: semgrep
        run: |
          semgrep scan --config=p/auto --json --output semgrep-report.json || true
          SEMGREP_FINDINGS=$(python3 - <<'PY'
          import json
          try:
              with open("semgrep-report.json") as f:
                  results = json.load(f).get("results", [])
              with open("semgrep-findings.txt", "w") as out:
                  for r in results[:10]:
                      out.write(f"{r.get('check_id')} — {r.get('path')}:{r.get('start', {}).get('line')}\n")
              print(len(results))
          except Exception:
              print(0)
          PY
          )
          echo "semgrep_findings=$SEMGREP_FINDINGS" >> "$GITHUB_OUTPUT"
          echo "Found $SEMGREP_FINDINGS semgrep finding(s)."

      - name: mypy — static type checking
        id: mypy
        run: |
          mypy "$SRC_DIR" \
            --strict --ignore-missing-imports \
            --python-version 3.11 \
            2>&1 | tee mypy-output.txt || true
          # Fixed counter (design §5.1): grep -c prints 0 AND exits 1 on zero matches;
          # the old '|| echo 0' appended a second 0, producing '00'.
          MYPY_ERRORS=$(grep -c "error:" mypy-output.txt || true)
          MYPY_ERRORS=${MYPY_ERRORS:-0}
          echo "mypy_errors=$MYPY_ERRORS" >> "$GITHUB_OUTPUT"
          echo "Found $MYPY_ERRORS type error(s)."
          grep "error:" mypy-output.txt | head -10 > mypy-findings.txt || true

      - name: bandit — security SAST
        id: bandit
        run: |
          bandit -r "$SRC_DIR" -ll -ii --format json --output bandit-report.json || true
          BANDIT_ISSUES=$(python3 - <<'PY'
          import json
          try:
              with open("bandit-report.json") as f:
                  results = json.load(f).get("results", [])
              with open("bandit-findings.txt", "w") as out:
                  for r in results[:10]:
                      head = f"{r.get('test_id')} ({r.get('issue_severity')})"
                      out.write(f"{head} — {r.get('filename')}:{r.get('line_number')}\n")
              print(len(results))
          except Exception:
              print(0)
          PY
          )
          echo "bandit_issues=$BANDIT_ISSUES" >> "$GITHUB_OUTPUT"
          echo "Found $BANDIT_ISSUES security issue(s)."

      - name: pip-audit — dependency CVE scan
        id: pip_audit
        run: |
          pip-audit --format json --output pip-audit-report.json || true
          PIP_AUDIT_VULNS=$(python3 - <<'PY'
          import json
          try:
              with open("pip-audit-report.json") as f:
                  deps = json.load(f).get("dependencies", [])
              lines = [f"{v.get('id')} — {d.get('name')} {d.get('version')}"
                      for d in deps for v in d.get("vulns", [])]
              with open("pip-audit-findings.txt", "w") as out:
                  out.writelines(l + "\n" for l in lines[:10])
              print(len(lines))
          except Exception:
              print(0)
          PY
          )
          echo "pip_audit_vulns=$PIP_AUDIT_VULNS" >> "$GITHUB_OUTPUT"
          echo "Vulnerable dependency findings: $PIP_AUDIT_VULNS — review pinned-dep CVEs"

      - name: radon — complexity & maintainability (single JSON pass)
        id: radon
        run: |
          radon cc "$SRC_DIR" --show-complexity --average --json > radon-cc-report.json || true
          radon mi "$SRC_DIR" --json > radon-mi-report.json || true
          RADON_COMPLEXITY=$(python3 - <<'PY'
          import json
          try:
              with open("radon-cc-report.json") as f:
                  data = json.load(f)
              hot = [(func.get("name"), func.get("rank"), path)
                     for path, funcs in data.items() for func in funcs
                     if func.get("rank", "") in ("C", "D", "E", "F")]
              with open("radon-findings.txt", "w") as out:
                  for name, rank, path in hot[:10]:
                      out.write(f"{name} (rank {rank}) — {path}\n")
              print(len(hot))
          except Exception:
              print(0)
          PY
          )
          echo "radon_complexity=$RADON_COMPLEXITY" >> "$GITHUB_OUTPUT"
          echo "Found $RADON_COMPLEXITY high-complexity function(s)."

      - name: vulture — dead code detection
        id: vulture
        run: |
          vulture "$SRC_DIR" --min-confidence 80 > vulture-report.txt || true
          VULTURE_DEAD=$(grep -c . vulture-report.txt || true)
          VULTURE_DEAD=${VULTURE_DEAD:-0}
          echo "vulture_dead=$VULTURE_DEAD" >> "$GITHUB_OUTPUT"
          echo "Found $VULTURE_DEAD potential dead code location(s)."
          head -10 vulture-report.txt > vulture-findings.txt || true

      - name: interrogate — docstring coverage
        id: interrogate
        run: |
          interrogate "$SRC_DIR" --fail-under=0 > interrogate-output.txt 2>&1 || true
          INTERROGATE_PCT=$(grep -oP "[0-9.]+%" interrogate-output.txt | tail -1 | tr -d "%" || true)
          INTERROGATE_PCT=${INTERROGATE_PCT:-0}
          echo "interrogate_pct=$INTERROGATE_PCT" >> "$GITHUB_OUTPUT"
          echo "Docstring coverage: $INTERROGATE_PCT%"
          tail -5 interrogate-output.txt > interrogate-findings.txt || true

      - name: Summary
        if: always()
        run: |
          section() {
            echo "### $1"
            echo ""
            echo "$2"
            echo ""
            if [ -s "$3" ]; then
              echo '```'
              cat "$3"
              echo '```'
              echo ""
            fi
          }
          {
            echo "## 🔍 Audit (advisory: security · complexity · types · docs)"
            echo ""
            section "🧠 mypy — static types" \
              "Type errors: **${{ steps.mypy.outputs.mypy_errors }}** (baseline 6 @ mypy 1.18.2)" mypy-findings.txt
            section "🛡️ bandit — security SAST" \
              "Security issues: **${{ steps.bandit.outputs.bandit_issues }}**" bandit-findings.txt
            section "🔎 semgrep — patterns" \
              "Findings: **${{ steps.semgrep.outputs.semgrep_findings }}**" semgrep-findings.txt
            section "📦 pip-audit — dependency CVEs" \
              "Vulnerability records: **${{ steps.pip_audit.outputs.pip_audit_vulns }}**" pip-audit-findings.txt
            section "📊 radon — complexity" \
              "High-complexity functions: **${{ steps.radon.outputs.radon_complexity }}**" radon-findings.txt
            section "🧟 vulture — dead code" \
              "Potential dead locations: **${{ steps.vulture.outputs.vulture_dead }}**" vulture-findings.txt
            section "📝 interrogate — docstrings" \
              "Docstring coverage: **${{ steps.interrogate.outputs.interrogate_pct }}%**" interrogate-findings.txt
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 5. AUTO-FIX (PR-branch commits / main check-only) ──────────────────
  auto-fix:
    name: Auto-fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: "${{ secrets.AUTO_FIX_TOKEN || secrets.GITHUB_TOKEN }}"
          # PR events: github.head_ref is the PR branch → commit lands on the PR branch
          ref: "${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}"
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install auto-fix tools
        run: pip install autoflake==2.3.1 pyupgrade==3.20.0 isort==6.0.1 ruff==0.14.8

      - name: Apply fixes
        run: |
          autoflake --in-place --recursive --remove-all-unused-imports --remove-unused-variables \
            --exclude .venv,__pycache__ "$SRC_DIR" "$TEST_DIR"
          find "$SRC_DIR" "$TEST_DIR" -name "*.py" -print0 | xargs -0 -r pyupgrade --py311-plus || true
          isort --profile black --line-length 127 "$SRC_DIR" "$TEST_DIR"
          ruff format --line-length 127 --target-version py311 "$SRC_DIR" "$TEST_DIR"
          ruff check --select E,F,B,C,SIM,PERF --ignore UP --fix --unsafe-fixes \
            --output-format=concise "$SRC_DIR" "$TEST_DIR" || true

      - name: Commit to PR branch (PR events)
        id: commit
        if: github.event_name == 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to fix."
          else
            git diff --name-only > autofix-files.txt
            git add -A
            git commit -m "chore: auto-fix (imports · lint · format)"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
            echo "Pushed fix commit to PR branch — synchronize run will validate it."
          fi

      - name: Report only (push to main)
        id: report
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "Clean."
          else
            git diff --name-only > autofix-files.txt
            git diff --stat
            echo "Main has auto-fixable issues — open a PR to apply them."
            exit 1 # red check on main signals drift; never pushes
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🩹 Auto-fix"
            echo ""
            if [ -s autofix-files.txt ]; then
              n=$(wc -l < autofix-files.txt)
              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                echo "Fixed **$n file(s)** — pushed to the PR branch (synchronize run validates)."
              else
                echo "**$n file(s)** auto-fixable on main — red check, nothing pushed."
              fi
              echo ""
              echo '```'
              cat autofix-files.txt
              echo '```'
            else
              echo "Nothing to fix — no commit pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 6. CI GATE (single required check) ──────────────────────────────────
  ci-gate:
    name: CI Gate
    needs: [lint, test, burn-in, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce policy
        env:
          JOB_LINT: ${{ needs.lint.result }}
          JOB_TEST: ${{ needs.test.result }}
          JOB_BURN_IN: ${{ needs.burn-in.result }}
          JOB_AUDIT: ${{ needs.audit.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          results = {n: os.environ[f"JOB_{n}"].lower() for n in ("LINT", "TEST", "BURN_IN", "AUDIT")}
          required = {"LINT": ("success",), "TEST": ("success",)}
          # audit/burn-in advisory: tolerated in any state for policy purposes
          blocking = {n for n, allowed in required.items() if results[n] not in allowed}
          if blocking:
              print("Blocking job failures:", ", ".join(sorted(blocking)))
              sys.exit(1)
          print("Required checks green; advisory: burn-in=", results["BURN_IN"], "audit=", results["AUDIT"])
          PY

      - name: Step summary
        if: always()
        run: |
          {
            echo "## 🚦 CI Gate — consolidated"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| test (matrix 3.11–3.14) | ${{ needs.test.result }} |"
            echo "| burn-in (advisory) | ${{ needs.burn-in.result }} |"
            echo "| audit (advisory) | ${{ needs.audit.result }} |"
            echo ""
            echo "### Metrics"
            echo ""
            echo "- mypy errors: ${{ needs.audit.outputs.mypy_errors }} (baseline 6 @ mypy 1.18.2)"
            echo "- pip-audit vulns: ${{ needs.audit.outputs.pip_audit_vulns }}"
            echo "- coverage floor: $COVERAGE_FAIL_UNDER%"
            echo "- scrapling pin: $SCRAPLING_VERSION (must match pyproject.toml)"
          } >> "$GITHUB_STEP_SUMMARY"
