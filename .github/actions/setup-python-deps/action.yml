---
name: "Setup Python + deps"
description: "Shared: python + pip cache, pinned project/test deps + tools, scrapling fetchers"

inputs:
  python-version:
    description: "Python version for this job"
    required: true
  install-tools:
    description: "Extra pinned tools to pip install (space-separated, caller-controlled)"
    required: false
    default: ""
  cache-scrapling:
    description: "Cache scrapling browser binaries"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Python with pip cache
      uses: actions/setup-python@v5
      with:
        python-version: "${{ inputs.python-version }}"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install project, test deps, and tools
      shell: bash
      env:
        # Security: input passed through env: to prevent script injection
        TOOLS: "${{ inputs.install-tools }}"
      run: |
        pip install -e .
        pip install pytest==9.1.1 pytest-cov==7.1.0 pytest-xdist==3.8.0 pytest-timeout==2.4.0
        if [ -n "$TOOLS" ]; then
          # shellcheck disable=SC2086 # TOOLS is a caller-controlled pinned list
          pip install $TOOLS
        fi

    # scrapling pin: pyproject.toml dependencies is the single source of truth —
    # resolved at runtime so the version can never drift across files.
    - name: Resolve pinned scrapling version from pyproject.toml
      shell: bash
      run: |
        v="$(python -c 'import tomllib; print(next(d.split("==")[1] for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"] if d.startswith("scrapling[fetchers]==")))')"
        echo "SCRAPLING_VERSION=$v" >> "$GITHUB_ENV"

    - name: Cache scrapling browser binaries
      if: inputs.cache-scrapling == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/scrapling
          ~/.cache/camoufox
        key: scrapling-${{ env.SCRAPLING_VERSION }}-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          scrapling-${{ env.SCRAPLING_VERSION }}-${{ runner.os }}-

    - name: Install scrapling fetchers
      shell: bash
      run: scrapling install
