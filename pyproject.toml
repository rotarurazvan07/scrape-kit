[build-system]
# Build backend floor, not a runtime dependency. 83.0.0 is the first release past
# advisory PYSEC-2026-3447 (CVE-2026-59890 / GHSA-h35f-9h28-mq5c), which affects
# MANIFEST.in-style file-list exclusions when packing an sdist; this repo ships no
# MANIFEST.in, but the floor keeps the backend clear of the advisory in audits.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-kit"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "rapidfuzz==3.14.6",
    "scrapling[fetchers]==0.4.15",  # single source of truth — CI reads this pin (setup-python-deps action)
    "pandas==3.0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.0.0,<8",
    "pytest-xdist>=3.8.0,<4",
    "pytest-timeout>=2.3.1,<3",
]
[tool.setuptools.packages.find]
# Discovers scrape_kit/ automatically.
# When you add sub-packages (e.g. scrape_kit/fetchers/) they are picked
# up without any changes here.
where = ["."]
include = ["scrape_kit*"]

[tool.setuptools.package-data]
scrape_kit = ["py.typed"]
