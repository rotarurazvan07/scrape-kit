[build-system]
# Floor covers two advisories: PYSEC-2026-3447 / CVE-2026-59890 (sdist MANIFEST.in
# exclusion bypass via Unicode NFD/NFC normalization on case-insensitive macOS
# filesystems) is fixed in 83.0.0, and GHSA-xmj3-9gf7-h52w (Windows legacy
# install_as_egg namespace-package path escape) is fixed in 84.1.0 — one 84.1.0
# floor satisfies both.
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrape-kit"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "rapidfuzz==3.14.6",
    "scrapling[fetchers]==0.4.15",
    "pandas==3.0.6",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.0.0,<8",
    "pytest-xdist>=3.8.0,<4",
    "pytest-timeout>=2.3.1,<3",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["scrape_kit*"]

[tool.setuptools.package-data]
scrape_kit = ["py.typed"]
